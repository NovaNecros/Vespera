<!-- Vespera/app/presentation/templates/base.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vespera{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="{{ url_for('static', filename='js/tailwind.config.js') }}"></script>

    <!-- FontAwesome 7 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <!-- Vespera -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/_palette.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/partials/_navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/partials/_alert_modal.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/partials/_overlay.css') }}">

    {% block styles %}{% endblock %}
</head>
<body class="bg-vespera-void text-vespera-ink font-serif min-h-screen flex flex-col justify-between selection:bg-vespera-crimson selection:text-vespera-bone">
    {% include "partials/_navbar.html" %}

    <main class="w-full max-w-[1820px] mx-auto px-4 sm:px-8 lg:px-12 py-6 flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Partials -->
    {% include "partials/_alert_modal.html" %}
    {% include "partials/_overlay.html" %}

    <!-- Vespera -->
    <script type="module" src="{{ url_for('static', filename='js/base.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/partials/_navbar.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/partials/_alert_modal.js') }}"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
