<!-- Vespera/app/presentation/templates/partials/_alert_modal.html -->

<div id="general-alert-modal" role="dialog"
     aria-labelledby="general-alert-modal-label" aria-modal="true"
     class="vespera-alert-modal vespera-dimmed-background fixed inset-0 z-[9998] hidden items-center justify-center p-4
            bg-vespera-void/85 backdrop-blur-md transition-opacity duration-300">

    <!-- Modal Dialog Card -->
    <div class="relative w-full max-w-md p-6 bg-vespera-charcoal border border-vespera-crimsonDark shadow-ambient
                rounded-vespera filigree-card alert-modal-content text-center"
         style="max-width : 480px;">
        <!-- Filigree Corners -->
        <div class="filigree-corner-tl"></div>
        <div class="filigree-corner-tr"></div>
        <div class="filigree-corner-bl"></div>
        <div class="filigree-corner-br"></div>

        <!-- Close Button -->
        <button id="alert-modal-close-icon-btn" type="button" aria-label="Close"
                class="absolute top-3 right-3 text-vespera-boneSilent hover:text-vespera-parchment hover:rotate-90
                       transition-all duration-200 text-lg w-8 h-8 flex items-center justify-center">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="pt-2">
            <!-- Icon Emblem -->
            <div id="alert-modal-icon-wrapper"
                 class="alert-modal-icon-wrapper mb-4 mx-auto alert-type-danger">
                <i id="alert-modal-icon" class="fa-solid fa-triangle-exclamation"></i>
            </div>

            <!-- Modal Title -->
            <h4 id="general-alert-modal-label"
                class="font-cinzel text-vespera-parchment font-bold text-lg mb-2 tracking-wide">
                <!-- TS -->
            </h4>

            <!-- Modal Message -->
            <div id="alert-modal-message"
                 class="text-vespera-boneSilent font-serif text-base mb-6 leading-relaxed">
                <!-- TS -->
            </div>

            <!-- Modal Input -->
            <div id="alert-modal-input-container"
                 class="w-full mb-5 flex-col items-start gap-1.5 text-left hidden">
                <label id="alert-modal-input-label" for="alert-modal-input"
                       class="font-cinzel text-xs text-vespera-silver">
                    <!-- TS -->
                </label>
                <input id="alert-modal-input" type="text"
                       class="vamp-input text-xs w-full py-2 px-3 border border-vespera-iron focus:border-vespera-silver"
                       placeholder="Inscribe text here...">
            </div>

            <!-- Botones -->
            <div class="flex justify-center items-center gap-3">
                <button id="alert-modal-dismiss-btn" type="button"
                        class="vamp-btn vamp-btn-silver px-6 py-2 text-xs">
                    <i class="fa-solid fa-xmark mr-2"></i>
                    <!-- TS -->
                </button>
                <button id="alert-modal-confirm-btn" type="button"
                        class="vamp-btn vamp-btn-crimson px-5 py-1.5 text-xs font-bold tracking-wider hidden">
                    <i class="fa-solid fa-feather mr-1.5"></i>
                    <!-- TS -->
                </button>
            </div>
        </div>
    </div>
</div>
